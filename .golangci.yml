version: "2"

# 带 build tag 的测试文件（集成测试、生成器夹具）也要检查，否则它们从不被 lint。
run:
  build-tags:
    - integration
    - genfixture

# 最小必要集：新增 linter 前先确认它在这个项目里报的是真问题。
# nolintlint 要求 //nolint 指明具体 linter 并写明理由：给检查开例外本身就是
# 规则变更，必须留下可审查的说明。
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - nolintlint
    - sloglint
  settings:
    nolintlint:
      require-specific: true
      require-explanation: true
    # 日志关联字段（request_id、user_id、任务 kind 等）存在 ctx 里，由根 Handler 输出时补上；
    # 不带 ctx 的 Info/Error 会悄悄丢掉它们，所以一律用 InfoContext/ErrorContext。
    # msg 是固定短语、字段名是 snake_case，才能按 msg 聚合、按字段名检索（见 docs/agents/observability.md）。
    sloglint:
      context: all
      static-msg: true
      key-naming-case: snake

formatters:
  enable:
    - gofmt
    - goimports
