version: "2"

# 带 build tag 的测试文件（集成测试、生成器夹具）也要检查，否则它们从不被 lint。
run:
  build-tags:
    - integration
    - genfixture

# 最小必要集：新增 linter 前先确认它在这个项目里报的是真问题。
# nolintlint 要求 //nolint 指明具体 linter 并写明理由：给检查开例外本身就是
# 规则变更，必须留下可审查的说明。
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - nolintlint
    - sloglint
  settings:
    nolintlint:
      require-specific: true
      require-explanation: true
    # 日志关联字段（request_id、user_id、任务 kind 等）存在 ctx 里，由根 Handler 输出时补上；
    # 不带 ctx 的 Info/Error 会悄悄丢掉它们，所以一律用 InfoContext/ErrorContext。
    # msg 是固定短语、字段名是 snake_case，才能按 msg 聚合、按字段名检索（见 docs/agents/observability.md）。
    sloglint:
      context: all
      static-msg: true
      key-naming-case: snake
      # 字段一律写成 slog.Attr（slog.String、slog.Any…）：键值对写法少一个值时只在运行时变成 !BADKEY。
      attr-only: true
      # 不用 slog 的全局函数：logger 从 ctx 取（logctx.From），测试和组件才能换掉它。
      no-global: all
      # 这些字段由 slog 自身（time、level、msg、source）或入口（internal/kit/logctx 与 process.Identity）写入；
      # 手写会在同一行 JSON 里出现重复的键，多数解析器只保留后一个。
      forbidden-keys:
        - time
        - level
        - msg
        - source
        - request_id
        - user_id
        - staff_id
        - method
        - route
        - job_kind
        - job_id
        - attempt
        - service_name
        - service_version
        - service_instance_id

  exclusions:
    rules:
      # 定义和写入这些字段的地方本身要用到它们。
      - path: internal/(kit/logctx|platform/logger|platform/process)/
        linters: [sloglint]
        text: key is forbidden

formatters:
  enable:
    - gofmt
    - goimports
