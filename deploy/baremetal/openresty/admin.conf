
# 后台（render.sh 指定了 --admin-port 时拼进 {{name}}.conf）：独立域名，后台前端页面和 /admin/v1 同源，会话 cookie 只属于这个主机名。
upstream {{name}}_admin {
    server 127.0.0.1:{{admin_port}};
    keepalive 8;
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_name {{admin_domain}};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name {{admin_domain}};
    ssl_certificate     /etc/openresty/certs/{{admin_domain}}.crt;
    ssl_certificate_key /etc/openresty/certs/{{admin_domain}}.key;
    access_log /var/log/openresty/{{name}}_admin_access.log trace_json;
    include snippets/proxy.conf;

    location = /metrics { return 404; }
    location = /healthz { return 404; }
    location = /readyz { return 404; }
    location ~ ^/(docs|admin\.yaml)$ { return 404; }   # 测试环境删掉这一行，文档随 location / 转发
    # /admin/v1/ 接口（员工会话 + 逐操作授权）和后台前端页面（公开的构建产物）
    location / { proxy_pass http://{{name}}_admin; }
}
