# {{name}} 的网关配置，由 deploy/baremetal/render.sh 生成为 {{name}}.conf，放进 OpenResty 的 http 块（如 /etc/openresty/conf.d/），
# 依赖全机一份的 http.conf 和 snippets/proxy.conf。见 docs/agents/deploy-ci.md 的"裸机发布"。
# 网关只转发业务路径：/healthz、/readyz、/metrics、文档不需要登录，只在本机直接访问端口。

# upstream 只有一个地址：systemd 持有的 socket（{{name}}-api.socket），{{name}}-api@1、@2 共享它、发布时轮流接管，
# 网关看不到实例切换，不需要主动健康检查、max_fails，发布不 reload。单个 server 时 nginx 不会把它标记为不可用。
upstream {{name}}_api {
    server 127.0.0.1:{{api_port}};
    keepalive 32;
    keepalive_timeout 4s;          # 必须 <= HTTP_SHUTDOWN_DRAIN(5s) - 1s
}
@gateway
@gateway # 网关鉴权（render.sh 给了 --internal-port 时才有这些行，见 docs/agents/auth.md 的"网关鉴权"）：api 的内部端口，
@gateway # 只挂会话校验端点。和前台一样是 systemd 持有、两个实例共享的 socket。
@gateway upstream {{name}}_api_internal {
@gateway     server 127.0.0.1:{{internal_port}};
@gateway     keepalive 16;
@gateway     keepalive_timeout 4s;
@gateway }

server {
    listen 80;
    server_name {{api_domain}};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name {{api_domain}};
    ssl_certificate     /etc/openresty/certs/{{api_domain}}.crt;
    ssl_certificate_key /etc/openresty/certs/{{api_domain}}.key;
    access_log /var/log/openresty/{{name}}_access.log {{api_log_format}};
    include snippets/proxy.conf;

@gateway     # 由 gateway_auth.lua 写入：anonymous、ok、invalid_token、session_replaced、rate_limited、unavailable，记进访问日志的 auth 字段。
@gateway     set $auth_result "";
@gateway
@gateway     # 校验会话的子请求：不带请求体；请求头只转发下面显式列出的（白名单），user 服务看不到 Cookie 和其它业务头。
@gateway     # 超时和重试沿用 snippets/proxy.conf：校验是幂等的 GET，发布和进程重启时要和业务请求一样能重试、排队等待。
@gateway     location = /_auth {
@gateway         internal;
@gateway         proxy_pass_request_body off;
@gateway         proxy_pass_request_headers off;
@gateway         # location 里写了 proxy_set_header，server 级的（snippets/proxy.conf）不再继承：需要的头在这里重写一遍。
@gateway         proxy_set_header Authorization $http_authorization;
@gateway         proxy_set_header Content-Length "";
@gateway         proxy_set_header Host $host;
@gateway         proxy_set_header Connection "";
@gateway         proxy_set_header X-Forwarded-For $remote_addr;
@gateway         proxy_set_header X-Trace-Id $auth_trace_id;
@gateway         proxy_set_header traceparent "";
@gateway         proxy_set_header tracestate "";
@gateway         proxy_pass http://{{name}}_api_internal/internal/auth/verify;
@gateway     }
@gateway
    location /v1/ {
@gateway         set $auth_trace_id "";
@gateway         access_by_lua_file /etc/openresty/lua/gateway_auth.lua;
        proxy_pass http://{{name}}_api;
    }
    # 只在测试环境（HTTP_API_DOCS_ENABLED=true）加这一行：文档公开访问，见 deploy-ci.md 的"文档按环境开关"。
    # location ~ ^/(docs|openapi\.yaml)$ { proxy_pass http://{{name}}_api; }
    location / { return 404; }    # /metrics、/healthz、/readyz、生产的文档和其它一切路径
}
