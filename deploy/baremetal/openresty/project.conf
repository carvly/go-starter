# {{name}} 的网关配置，由 deploy/baremetal/render.sh 生成为 {{name}}.conf，放进 OpenResty 的 http 块（如 /etc/openresty/conf.d/），
# 依赖全机一份的 http.conf 和 snippets/proxy.conf。见 docs/agents/deploy-ci.md 的"裸机发布"。
# 网关只转发业务路径：/healthz、/readyz、/metrics、文档不需要登录，只在本机直接访问端口。

# upstream 只有一个地址：systemd 持有的 socket（{{name}}-api.socket），{{name}}-api@1、@2 共享它、发布时轮流接管，
# 网关看不到实例切换，不需要主动健康检查、max_fails，发布不 reload。单个 server 时 nginx 不会把它标记为不可用。
upstream {{name}}_api {
    server 127.0.0.1:{{api_port}};
    keepalive 32;
    keepalive_timeout 4s;          # 必须 <= HTTP_SHUTDOWN_DRAIN(5s) - 1s
}

server {
    listen 80;
    server_name {{api_domain}};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name {{api_domain}};
    ssl_certificate     /etc/openresty/certs/{{api_domain}}.crt;
    ssl_certificate_key /etc/openresty/certs/{{api_domain}}.key;
    access_log /var/log/openresty/{{name}}_access.log trace_json;
    include snippets/proxy.conf;

    location /v1/ { proxy_pass http://{{name}}_api; }
    # 只在测试环境（HTTP_API_DOCS_ENABLED=true）加这一行：文档公开访问，见 deploy-ci.md 的"文档按环境开关"。
    # location ~ ^/(docs|openapi\.yaml)$ { proxy_pass http://{{name}}_api; }
    location / { return 404; }    # /metrics、/healthz、/readyz、生产的文档和其它一切路径
}
