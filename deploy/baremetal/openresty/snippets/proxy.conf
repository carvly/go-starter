# api.example.com 与 admin.example.com 两个 server 块共用。proxy_* 写在 server 级、location 只写 proxy_pass：
# location 里一旦出现 proxy_set_header，server 级的全部不再继承。

# HSTS 由网关加（always：网关自己返回的 404 也带）；应用的 HTTP_HSTS_MAX_AGE 保持 0，不重复发。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;   # 网关是边缘时直接覆盖，防伪造
proxy_set_header X-Forwarded-Proto $scheme;
# 删掉客户端带来的信任身份头：应用配置成信任 header 模式时，它就是登录身份（见 docs/agents/auth.md）。
proxy_set_header X-User-ID "";
# 网关生成的 $trace_id（见 app.conf 的 map）：应用在 HTTP_TRUSTED_PROXY=true 时用它作根 span 的 trace_id，
# 访问日志、应用日志、trace、响应头 X-Trace-Id 同一个值。
proxy_set_header X-Trace-Id $trace_id;
proxy_set_header traceparent "";                 # 边缘不接受外部的 trace
proxy_set_header tracestate "";
proxy_connect_timeout 2s;
proxy_read_timeout 30s;                          # > HTTP_REQUEST_TIMEOUT(10s)
# 只把"连接/传输错误"算作失败并换实例：连接被拒时请求未发出，POST 也会被转发。
# 不写 timeout：否则超过读超时的慢请求会被记为失败，max_fails=1 时一个慢请求就让实例被摘 fail_timeout 秒；
# 不写 http_502：应用自身不返回 502。总时限 5s：在途超过 5s 的请求不再重试，避免慢请求被重复执行。
proxy_next_upstream error;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 5s;
