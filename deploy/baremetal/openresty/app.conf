# 放进 OpenResty 的 http 块（如 /etc/openresty/conf.d/app.conf），见 docs/agents/deploy-ci.md 的"裸机双实例发布"。
# 网关只转发业务路径：/healthz、/readyz、/metrics、文档不需要登录，只在本机直接访问端口。

log_format app_json escape=json '{"time":"$time_iso8601","trace_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status","request_time":$request_time,"upstream_time":"$upstream_response_time"}';

upstream app_api {
    server 127.0.0.1:8080 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8082 max_fails=1 fail_timeout=5s;
    keepalive 32;
    keepalive_timeout 4s;          # 必须 <= HTTP_SHUTDOWN_DRAIN(6s) - 1s
}

upstream app_admin {
    server 127.0.0.1:8081 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8083 max_fails=1 fail_timeout=5s;
    keepalive 8;
    keepalive_timeout 4s;
}

# 主动健康检查（OpenResty 自带的 lua-resty-upstream-healthcheck）：每秒直接探测每个实例端口的 /readyz，
# 一次非 200 就摘掉。实例排空期 /readyz 返回 503，网关在关闭 listener 之前就不再往它发新请求；
# 新实例连续 2 次 200 才恢复。HTTP_SHUTDOWN_DRAIN 必须留出探测 + 各 worker 同步状态的时间（约 3s）。
lua_shared_dict healthcheck 1m;
init_worker_by_lua_block {
    local hc = require "resty.upstream.healthcheck"
    for _, u in ipairs({"app_api", "app_admin"}) do
        local ok, err = hc.spawn_checker{
            shm = "healthcheck",
            upstream = u,
            type = "http",
            http_req = "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n",
            interval = 1000,
            timeout = 500,
            fall = 1,
            rise = 2,
            valid_statuses = {200},
            concurrency = 2,
        }
        if not ok then
            ngx.log(ngx.ERR, "healthcheck ", u, ": ", err)
        end
    end
}

# 80 端口只做跳转
server {
    listen 80;
    server_name api.example.com admin.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate     /etc/openresty/certs/example.com.crt;
    ssl_certificate_key /etc/openresty/certs/example.com.key;
    access_log /var/log/openresty/app_access.log app_json;
    include snippets/app_proxy.conf;

    location /v1/ { proxy_pass http://app_api; }
    # 只在测试环境（HTTP_API_DOCS_ENABLED=true）加这一行：文档公开访问，见 deploy-ci.md 的"文档按环境开关"。
    # location ~ ^/(docs|openapi\.yaml)$ { proxy_pass http://app_api; }
    location / { return 404; }    # /metrics、/healthz、/readyz、生产的文档和其它一切路径
}

server {
    listen 443 ssl;
    server_name admin.example.com;
    ssl_certificate     /etc/openresty/certs/example.com.crt;
    ssl_certificate_key /etc/openresty/certs/example.com.key;
    access_log /var/log/openresty/app_admin_access.log app_json;
    include snippets/app_proxy.conf;

    location = /metrics { return 404; }
    location = /healthz { return 404; }
    location = /readyz { return 404; }
    location ~ ^/(docs|admin\.yaml)$ { return 404; }   # 测试环境删掉这一行，文档随 location / 转发
    # /admin/v1/ 接口（员工会话 + 逐操作授权）和后台前端页面（公开的构建产物）
    location / { proxy_pass http://app_admin; }
}
