# 全机一份（不随项目渲染）：放进 OpenResty 的 http 块（如 /etc/openresty/conf.d/00-http.conf），各项目的配置都依赖它。
# 见 docs/agents/deploy-ci.md 的"裸机发布"。

# 只用 trace_id 这一个名字：nginx 内置的 $request_id（每个请求随机的 32 位十六进制）只在这里出现，其余配置一律用 $trace_id。
map $request_id $trace_id { default $request_id; }

log_format trace_json escape=json '{"time":"$time_iso8601","trace_id":"$trace_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status","request_time":$request_time,"upstream_time":"$upstream_response_time"}';
