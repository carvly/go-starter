# 全机一份（不随项目渲染）：放到 /etc/sysctl.d/90-somaxconn.conf 后 sysctl --system。只有 CentOS 7（内核 3.10）需要：
# 内核 5.4 起默认就是 4096。accept 队列只在没有实例 accept 时堆积（崩溃到新进程就绪、首次启动）；128 时满了内核会丢握手包，
# 请求延迟成倍增加，超过网关 proxy_connect_timeout 的变成 502。全机参数，共用机器上调整前告知其它服务的负责人。
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
